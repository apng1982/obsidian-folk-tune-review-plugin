# .github/workflows/release-beta.yml
#
# Create a GitHub PRE-RELEASE for BRAT/mobile beta testing.
#
# This workflow is intentionally separate from the stable release workflow.
#
# Trigger:
#   Push a prerelease tag from a commit that is reachable from the `prerelease`
#   branch.
#
# Accepted tag formats:
#   0.4.0-beta.1
#   0.4.0-beta.2
#   0.4.0-rc.1
#
# Manual prerelease process:
#   1. Merge feature work into the `prerelease` branch.
#   2. Update manifest.json version to the prerelease version.
#      Example: "0.4.0-beta.1"
#   3. If package.json has a version field, update it to the same version.
#   4. Commit and push `prerelease`.
#   5. Tag the exact prerelease commit:
#
#        git checkout prerelease
#        git pull
#        git tag 0.4.0-beta.1
#        git push origin 0.4.0-beta.1
#
#   6. GitHub creates a prerelease with:
#        manifest.json
#        main.js
#        styles.css, if present
#
#   7. Install/update on mobile using BRAT.
#
# Safety checks:
#   - The tag must look like a prerelease tag.
#   - The tagged commit must be reachable from origin/prerelease.
#   - manifest.json version must exactly match the tag.
#   - package.json version must exactly match the tag, if package.json has one.
#   - manifest.json must contain isDesktopOnly=false.
#
# This workflow does NOT publish to the Obsidian community plugin directory.
# It only creates GitHub prerelease assets suitable for beta testing.

name: Release beta

on:
  push:
    tags:
      - "*.*.*-beta.*"
      - "*.*.*-rc.*"

permissions:
  contents: write

concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  RELEASE_BRANCH: "prerelease"

jobs:
  release-beta:
    name: Build and publish beta release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and branch
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          echo "Tag: ${TAG}"
          echo "Commit: ${GITHUB_SHA}"

          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+$ ]]; then
            echo "::error::Beta tags must match N.N.N-beta.N or N.N.N-rc.N, e.g. 0.4.0-beta.1"
            exit 1
          fi

          git fetch origin "${RELEASE_BRANCH}:${RELEASE_BRANCH}" --force

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "${RELEASE_BRANCH}"; then
            echo "::error::Tagged commit must be reachable from origin/${RELEASE_BRANCH}."
            echo "Create beta/rc tags only from the prerelease branch."
            exit 1
          fi

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest/package versions
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const tag = process.env.GITHUB_REF_NAME;
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));

          if (manifest.version !== tag) {
            console.error(`manifest.json version (${manifest.version}) must equal tag (${tag}).`);
            process.exit(1);
          }

          if (manifest.isDesktopOnly !== false) {
            console.error("manifest.json must contain \"isDesktopOnly\": false for this mobile-first plugin.");
            process.exit(1);
          }

          if (fs.existsSync("package.json")) {
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.version && pkg.version !== tag) {
              console.error(`package.json version (${pkg.version}) must equal tag (${tag}).`);
              process.exit(1);
            }
          }

          console.log("Manifest/package version checks passed.");
          NODE

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build release assets
        run: npm run build

      - name: Prepare release asset directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-assets
          mkdir release-assets

          cp manifest.json release-assets/manifest.json
          cp main.js release-assets/main.js

          if [ -f styles.css ]; then
            cp styles.css release-assets/styles.css
          fi

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/*
          body: |
            Beta release for BRAT/mobile testing.

            Manual test checklist:
            - Install/update this version through BRAT in a mobile test vault.
            - Confirm the plugin loads with manifest isDesktopOnly=false.
            - Run Review in dry-run mode.
            - Run Review in live mode on a disposable test vault.
            - Run Stats.
            - Run Initialize/Validate on a disposable test vault.
            - Confirm no desktop-only APIs or filesystem path assumptions are used.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
